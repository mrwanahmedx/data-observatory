name: Credit Risk Model CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .[dev]
      - name: Run tests
        run: pytest -q
      - name: Run example pipeline
        run: python -m credit_risk_model.pipeline
