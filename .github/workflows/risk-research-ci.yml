name: Risk Research CI

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/risk-research-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/risk-research-ci.yml"

permissions:
  contents: read

jobs:
  python-risk-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn
      - name: Run IFRS 9 model tests
        run: python -m unittest research/ifrs9-modeling/test_ifrs9_model.py -v
      - name: Run model validation tests
        run: python -m unittest research/model-validation/test_validation_lab.py -v
      - name: Execute demonstration pipelines
        run: |
          python research/ifrs9-modeling/ifrs9_model.py
          python research/model-validation/validation_lab.py
